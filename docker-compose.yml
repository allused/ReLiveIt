services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reliveit
      POSTGRES_PASSWORD: reliveit
      POSTGRES_DB: reliveit
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reliveit -d reliveit']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
