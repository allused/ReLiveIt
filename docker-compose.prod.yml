services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reliveit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: reliveit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reliveit -d reliveit']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://reliveit:${POSTGRES_PASSWORD}@postgres:5432/reliveit
      FRONTEND_URL: ${FRONTEND_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      INVITATION_TOKEN_HASH_SECRET: ${INVITATION_TOKEN_HASH_SECRET}
      INVITATION_TOKEN_ENCRYPTION_KEY: ${INVITATION_TOKEN_ENCRYPTION_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      STORAGE_DIR: /data/uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      MAX_GALLERY_PHOTOS: ${MAX_GALLERY_PHOTOS:-30}
      TOP_N: ${TOP_N:-10}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
